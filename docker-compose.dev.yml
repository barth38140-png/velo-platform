services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: velo_platform_frontend_dev
    environment:
      # Use relative API path so the browser sends requests to the dev server
      # which will proxy /api to the backend service inside Docker.
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:cached
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - velo_network

  backend:
    build: ./backend
    container_name: velo_platform_backend_dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: velo_platform_test
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app:cached
    depends_on:
      - postgres
    networks:
      velo_network:
        aliases:
          - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5000/health\", res=>{process.exit(res.statusCode===200?0:1)})'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: velo_platform_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: velo_platform_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - velo_network

networks:
  velo_network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
