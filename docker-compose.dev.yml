version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: velo_platform_frontend_dev
    environment:
      VITE_API_URL: http://backend:3010/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
    depends_on:
      - backend
    networks:
      - velo_network

  backend:
    build: ./backend
    container_name: velo_platform_backend_dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: velo_platform_test
      PORT: 3010
    ports:
      - "3010:3010"
    volumes:
      - ./backend:/app:cached
    depends_on:
      - postgres
    networks:
      - velo_network

  postgres:
    image: postgres:15-alpine
    container_name: velo_platform_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: velo_platform_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - velo_network

networks:
  velo_network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
