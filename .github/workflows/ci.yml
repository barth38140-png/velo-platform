name: CI

on:
  push:
    branches: [ main, master, ci/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-frontend-tests:
    name: Lint and Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Run ESLint (backend + frontend)
        run: |
          npm --prefix backend run lint || true
          npm --prefix frontend run lint || true

      - name: Run frontend tests
        run: |
          npm --prefix frontend test

  backend-tests:
    name: Backend tests with Postgres
    runs-on: ubuntu-latest
    needs: lint-and-frontend-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: velo_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize test DB
        run: |
          chmod +x backend/scripts/init_test_db.sh
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=test PGDATABASE=velo_platform_test ./backend/scripts/init_test_db.sh

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        env:
          PGHOST: localhost
          PGPASSWORD: test
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: velo_platform_test
          NODE_ENV: test
        run: |
          cd backend
          npm test --silent
name: CI velo-platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: velo_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: velo_platform_test
      NODE_ENV: test
      PORT: 3010
      VITE_API_URL: http://localhost:3010/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run backend migrations/seed
        run: |
          cd backend
          npm run migrate || true
          npm run seed || true
      - name: Run backend tests
        run: |
          cd backend
          npm test
      - name: Run frontend linter
        run: |
          cd frontend
          npm run lint
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Run Cypress E2E tests
        run: |
          cd frontend
          npm run dev:test &
          npx wait-on http://localhost:3000
          npx cypress run --config baseUrl=http://localhost:3000
