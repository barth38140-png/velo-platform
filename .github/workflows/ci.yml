name: CI velo-platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: velo_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: velo_platform_test
      NODE_ENV: test
      PORT: 3010
      VITE_API_URL: http://localhost:3010/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run backend migrations/seed
        run: |
          cd backend
          npm run migrate || true
          npm run seed || true
      - name: Run backend tests
        run: |
          cd backend
          npm test
      - name: Run frontend linter
        run: |
          cd frontend
          npm run lint
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Run Cypress E2E tests
        run: |
          cd frontend
          npm run dev:test &
          npx wait-on http://localhost:3000
          npx cypress run --config baseUrl=http://localhost:3000
