name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Collect coverage
        run: npm run test -- --coverage --ci || npm test -- --coverage
        continue-on-error: true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Fail if coverage < 75%
        run: |
          COV=$(node -e "const r=require('fs').readFileSync('coverage/coverage-summary.json','utf8');const p=JSON.parse(r);console.log(p.total.lines.pct);if(p.total.lines.pct<75){process.exit(1)}")
        working-directory: ./backend
