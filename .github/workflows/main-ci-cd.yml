name: 🚀 CI/CD Complet - Velo Platform

# Workflow unifié : Commit → Tests → Analyse → Auto-Fix → Monitoring → Déploiement
on:
  push:
    branches: [ main, master, develop, ci/** ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '15-alpine'

jobs:
  # ============================================================
  # PHASE 1: Analyse Statique & Lint
  # ============================================================
  lint-analysis:
    name: 📋 Analyse Statique (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      
      - name: ESLint Backend
        run: cd backend && npm run lint || echo "⚠️ Backend lint warnings"
        continue-on-error: true
      
      - name: ESLint Frontend
        run: cd frontend && npm run lint || echo "⚠️ Frontend lint warnings"
        continue-on-error: true
      
      - name: 📊 Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            backend/eslint-report.json
            frontend/eslint-report.json
          retention-days: 7

  # ============================================================
  # PHASE 2: Tests Unitaires & Intégration
  # ============================================================
  backend-tests:
    name: 🧪 Tests Backend + Coverage
    runs-on: ubuntu-latest
    needs: lint-analysis
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_secret_2024
          POSTGRES_DB: velo_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Wait for Postgres
        env:
          PGPASSWORD: test_secret_2024
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done
      
      - name: Initialize Test Database
        env:
          PGPASSWORD: test_secret_2024
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: velo_platform_test
        run: |
          if [ -f backend/scripts/init_test_db.sh ]; then
            chmod +x backend/scripts/init_test_db.sh
            ./backend/scripts/init_test_db.sh
          fi
          if [ -f backend/sql/init.sql ]; then
            psql -h localhost -U postgres -d velo_platform_test -f backend/sql/init.sql
          fi
      
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      
      - name: Run Backend Tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test_secret_2024
          PGDATABASE: velo_platform_test
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_2024
        run: |
          cd backend
          npm test -- --coverage --runInBand
      
      - name: Check Coverage Threshold
        run: |
          cd backend
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "
              const report = require('./coverage/coverage-summary.json');
              const linePct = report.total.lines.pct;
              console.log('Coverage:', linePct + '%');
              if (linePct < 75) {
                console.error('❌ Coverage is below 75%!');
                process.exit(1);
              }
              console.log('✅ Coverage OK');
            ")
            echo "$COVERAGE"
          fi
      
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

  frontend-tests:
    name: 🎨 Tests Frontend + Vitest
    runs-on: ubuntu-latest
    needs: lint-analysis
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Run Frontend Unit Tests
        run: cd frontend && npm run test:ci
      
      - name: Upload Frontend Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 7

  # ============================================================
  # PHASE 3: Tests E2E Cypress
  # ============================================================
  e2e-tests:
    name: 🌐 Tests E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_secret_2024
          POSTGRES_DB: velo_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
      
      - name: Start Backend Server
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: test_secret_2024
          PGDATABASE: velo_platform_test
          NODE_ENV: test
          PORT: 5000
        run: |
          cd backend
          npm start &
          sleep 10
      
      - name: Start Frontend Dev Server
        run: |
          cd frontend
          VITE_API_URL=http://localhost:5000/api npm run dev &
          sleep 15
      
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          wait-on: 'http://localhost:5173, http://localhost:5000/api/health'
          wait-on-timeout: 120
          browser: chrome
          record: false
        continue-on-error: true
      
      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/videos/
            frontend/cypress/screenshots/
          retention-days: 7

  # ============================================================
  # PHASE 4: Analyse Qualité & Sécurité
  # ============================================================
  security-audit:
    name: 🔒 Audit Sécurité (npm audit)
    runs-on: ubuntu-latest
    needs: lint-analysis
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --production || echo "⚠️ Vulnérabilités détectées"
        continue-on-error: true
      
      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --production || echo "⚠️ Vulnérabilités détectées"
        continue-on-error: true

  # ============================================================
  # PHASE 5: Build & Validation Docker
  # ============================================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: velo-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: velo-platform-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # PHASE 6: Monitoring & Health Check (Post-Deploy)
  # ============================================================
  monitoring-check:
    name: 📊 Monitoring & Health Score
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Check CI/CD Status
        run: |
          echo "🔍 Vérification de l'état du CI/CD..."
          echo "- Lint: ${{ needs.lint-analysis.result }}"
          echo "- Backend Tests: ${{ needs.backend-tests.result }}"
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}"
      
      - name: Generate Health Report
        run: |
          cat << EOF > ci-health-report.json
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "results": {
              "lint": "${{ needs.lint-analysis.result }}",
              "backend_tests": "${{ needs.backend-tests.result }}",
              "frontend_tests": "${{ needs.frontend-tests.result }}",
              "e2e_tests": "${{ needs.e2e-tests.result }}"
            }
          }
          EOF
          cat ci-health-report.json
      
      - name: Upload Health Report
        uses: actions/upload-artifact@v4
        with:
          name: ci-health-report
          path: ci-health-report.json
          retention-days: 30

  # ============================================================
  # PHASE 7: Déploiement Automatique (si main/master)
  # ============================================================
  deploy:
    name: 🚀 Déploiement Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, build-docker, security-audit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://velo-platform.example.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Notification
        run: |
          echo "🚀 Déploiement vers PRODUCTION en cours..."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
      
      # TODO: Ajouter votre logique de déploiement ici
      # Exemples:
      # - Docker Hub push
      # - Kubernetes deployment
      # - SSH deploy to VPS
      # - Cloud provider (AWS, GCP, Azure)
      
      - name: Placeholder Deploy
        run: |
          echo "✅ Déploiement simulé réussi"
          echo "En production, ajoutez ici vos commandes de déploiement"

  # ============================================================
  # PHASE 8: Notifications & Feedback
  # ============================================================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: CI/CD Summary
        run: |
          echo "════════════════════════════════════════"
          echo "   🎯 CI/CD Velo Platform - Résumé"
          echo "════════════════════════════════════════"
          echo "✅ Pipeline terminé"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "════════════════════════════════════════"
