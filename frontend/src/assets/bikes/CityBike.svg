<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" aria-label="Vélo de ville">
  <defs>
    <linearGradient id="cityGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Vélo de ville - Design confortable et pratique -->
  
  <!-- Roue arrière -->
  <circle cx="140" cy="270" r="72" stroke="#1f2937" stroke-width="5" fill="none" />
  <circle cx="140" cy="270" r="62" stroke="#4b5563" stroke-width="1.5" fill="none" />
  <circle cx="140" cy="270" r="8" fill="#1f2937" />
  <!-- Rayons classiques -->
  <line x1="140" y1="270" x2="140" y2="198" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="212" y2="270" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="140" y2="342" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="68" y2="270" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="191" y2="219" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="191" y2="321" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="89" y2="219" stroke="#4b5563" stroke-width="1" />
  <line x1="140" y1="270" x2="89" y2="321" stroke="#4b5563" stroke-width="1" />
  
  <!-- Roue avant -->
  <circle cx="460" cy="270" r="72" stroke="#1f2937" stroke-width="5" fill="none" />
  <circle cx="460" cy="270" r="62" stroke="#4b5563" stroke-width="1.5" fill="none" />
  <circle cx="460" cy="270" r="8" fill="#1f2937" />
  <!-- Rayons classiques -->
  <line x1="460" y1="270" x2="460" y2="198" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="532" y2="270" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="460" y2="342" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="388" y2="270" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="511" y2="219" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="511" y2="321" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="409" y2="219" stroke="#4b5563" stroke-width="1" />
  <line x1="460" y1="270" x2="409" y2="321" stroke="#4b5563" stroke-width="1" />
  
  <!-- Garde-boue arrière complet -->
  <path d="M100 225 Q75 270 100 315" stroke="#374151" stroke-width="5" fill="none" stroke-linecap="round" />
  
  <!-- Garde-boue avant complet -->
  <path d="M420 225 Q395 270 420 315" stroke="#374151" stroke-width="5" fill="none" stroke-linecap="round" />
  
  <!-- Cadre principal (confortable) -->
  <path d="M175 265 L260 180 L340 180 L410 265" stroke="url(#cityGrad)" stroke-width="11" fill="none" stroke-linecap="round" />
  <!-- Tube diagonal bas (cadre ouvert pour facilité) -->
  <path d="M260 180 L310 245" stroke="url(#cityGrad)" stroke-width="9" fill="none" stroke-linecap="round" />
  <!-- Tube de selle -->
  <path d="M340 180 L300 245" stroke="url(#cityGrad)" stroke-width="9" fill="none" stroke-linecap="round" />
  <!-- Hauban arrière -->
  <path d="M305 245 L175 265" stroke="url(#cityGrad)" stroke-width="9" fill="none" stroke-linecap="round" />
  
  <!-- Porte-bagages arrière -->
  <path d="M290 150 L175 265" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M290 150 L350 150 L410 265" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round" />
  <line x1="290" y1="150" x2="350" y2="150" stroke="#1f2937" stroke-width="3" />
  <line x1="220" y1="210" x2="370" y2="210" stroke="#1f2937" stroke-width="3" />
  
  <!-- Panier avant -->
  <rect x="400" y="140" width="65" height="45" stroke="#8b4513" stroke-width="3" fill="none" rx="3" />
  <line x1="410" y1="140" x2="410" y2="185" stroke="#8b4513" stroke-width="2" />
  <line x1="425" y1="140" x2="425" y2="185" stroke="#8b4513" stroke-width="2" />
  <line x1="440" y1="140" x2="440" y2="185" stroke="#8b4513" stroke-width="2" />
  <line x1="455" y1="140" x2="455" y2="185" stroke="#8b4513" stroke-width="2" />
  
  <!-- Support panier -->
  <path d="M340 180 L405 162" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M405 162 L460 270" stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" />
  
  <!-- Guidon relevé et confortable -->
  <path d="M340 180 L360 150" stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M350 150 L400 145" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Poignées ergonomiques -->
  <ellipse cx="352" cy="150" rx="8" ry="5" fill="#374151" />
  <ellipse cx="400" cy="145" rx="8" ry="5" fill="#374151" />
  
  <!-- Sonnette -->
  <circle cx="370" cy="155" r="5" fill="#fbbf24" stroke="#1f2937" stroke-width="1" />
  
  <!-- Selle large et confortable -->
  <ellipse cx="295" cy="145" rx="35" ry="14" fill="#1f2937" />
  <ellipse cx="295" cy="145" rx="30" ry="10" fill="#4b5563" />
  <path d="M260 145 L260 180" stroke="#1f2937" stroke-width="5" fill="none" stroke-linecap="round" />
  
  <!-- Pédalier et manivelles -->
  <circle cx="305" cy="245" r="14" fill="#1f2937" />
  <path d="M305 245 L285 285" stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" />
  <rect x="278" y="283" width="14" height="9" fill="#374151" rx="2" />
  <path d="M305 245 L325 205" stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" />
  <rect x="318" y="197" width="14" height="9" fill="#374151" rx="2" />
  
  <!-- Chaîne avec protection -->
  <path d="M305 255 L175 268" stroke="#6b7280" stroke-width="2.5" fill="none" stroke-dasharray="3,2" />
  <path d="M305 240 L200 255 L175 268 L200 280 L305 260" stroke="#e5e7eb" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Béquille -->
  <path d="M280 245 L265 320" stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M265 320 L245 325 L250 315" stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Phare avant -->
  <circle cx="430" cy="185" r="8" fill="#fef3c7" stroke="#1f2937" stroke-width="2" />
  <circle cx="430" cy="185" r="5" fill="#fde047" />
  
  <!-- Catadioptre arrière -->
  <circle cx="290" cy="160" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  
  <!-- Logo -->
  <text x="265" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6366f1">CITY</text>
</svg>
