services:
  postgres:
    image: postgres:15-alpine
    container_name: velo_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: velo_platform_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - velo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: velo_platform_backend
    environment:
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: velo_platform_test
      PORT: 3010
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velo_network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: velo_platform_frontend
    environment:
      VITE_API_URL: http://backend:3010/api
      DEV_ALLOW_DOCKER: 'true'
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - velo_network
    volumes:
      - ./frontend:/app

  # Optionnel : tests E2E Cypress en mode headless
  cypress:
    image: cypress/included:12.17.0
    container_name: velo_platform_cypress
    depends_on:
      - frontend
    working_dir: /e2e
    environment:
      CYPRESS_baseUrl: http://frontend:3000
    volumes:
      - ./frontend:/e2e
    command: ["npx", "cypress", "run", "--config-file", "cypress.config.cjs"]
    networks:
      - velo_network

networks:
  velo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
