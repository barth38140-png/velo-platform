version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: velo_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
      POSTGRES_DB: velo_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - velo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optionnel: pgAdmin pour gérer la BD via interface web
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: velo_platform_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - velo_network
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  velo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
